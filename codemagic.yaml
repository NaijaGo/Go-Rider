workflows:
  android-release:
    name: Android Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      vars:
        GOOGLE_SERVER_CLIENT_ID: "878060644963-ujmbu0ka7g3rh07muknotij2lbsaq4oh.apps.googleusercontent.com"
        GOOGLE_IOS_CLIENT_ID: "878060644963-pfh25sa295qbh5fqqbhecegnpnclsc95.apps.googleusercontent.com"
        PACKAGE_NAME: "com.naijago.gorider"
        API_BASE_URL: "https://naijago-backend.onrender.com"
        ONESIGNAL_APP_ID: "d53ab8f7-7a3b-40e4-b3a3-025fa64004d1"
    cache:
      cache_paths:
        - ~/.pub-cache
        - ~/.gradle/caches
        - ~/.gradle/wrapper
    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/android/local.properties"
      - name: Install dependencies
        script: |
          flutter pub get
      - name: Analyze
        script: |
          flutter analyze
      - name: Run tests
        script: |
          flutter test
      - name: Configure Android signing
        script: |
          if [ -z "$CM_KEYSTORE" ] || [ -z "$CM_KEYSTORE_PASSWORD" ] || [ -z "$CM_KEY_ALIAS" ] || [ -z "$CM_KEY_PASSWORD" ]; then
            echo "Missing Android signing variables. Set CM_KEYSTORE, CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS, and CM_KEY_PASSWORD in Codemagic."
            exit 1
          fi

          echo "$CM_KEYSTORE" | base64 --decode > "$CM_BUILD_DIR/android/app/upload-keystore.jks"
          {
            printf "%s\n" "storePassword=$CM_KEYSTORE_PASSWORD"
            printf "%s\n" "keyPassword=$CM_KEY_PASSWORD"
            printf "%s\n" "keyAlias=$CM_KEY_ALIAS"
            printf "%s\n" "storeFile=upload-keystore.jks"
          } > "$CM_BUILD_DIR/android/key.properties"
      - name: Build Android artifacts
        script: |
          flutter build apk --release \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="${GOOGLE_SERVER_CLIENT_ID:-}" \
            --dart-define=GOOGLE_IOS_CLIENT_ID="${GOOGLE_IOS_CLIENT_ID:-}" \
            --dart-define=ONESIGNAL_APP_ID="$ONESIGNAL_APP_ID"
          flutter build appbundle --release \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="${GOOGLE_SERVER_CLIENT_ID:-}" \
            --dart-define=GOOGLE_IOS_CLIENT_ID="${GOOGLE_IOS_CLIENT_ID:-}" \
            --dart-define=ONESIGNAL_APP_ID="$ONESIGNAL_APP_ID"
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/bundle/release/*.aab

  ios-release:
    name: iOS App Store Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        GOOGLE_SERVER_CLIENT_ID: "878060644963-ujmbu0ka7g3rh07muknotij2lbsaq4oh.apps.googleusercontent.com"
        GOOGLE_IOS_CLIENT_ID: "878060644963-pfh25sa295qbh5fqqbhecegnpnclsc95.apps.googleusercontent.com"
        API_BASE_URL: "https://naijago-backend.onrender.com"
        ONESIGNAL_APP_ID: "d53ab8f7-7a3b-40e4-b3a3-025fa64004d1"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.naijago.gorider
    integrations:
      app_store_connect: naijago_mainapp_key
    cache:
      cache_paths:
        - ~/.pub-cache
        - ~/Library/Caches/CocoaPods
    scripts:
      - name: Install dependencies
        script: |
          flutter pub get
      - name: Install pods
        script: |
          cd ios
          pod install
      - name: Configure App Store signing
        script: |
          xcode-project use-profiles
      - name: Analyze
        script: |
          flutter analyze
      - name: Run tests
        script: |
          flutter test
      - name: Build signed IPA
        script: |
          dart run tool/configure_google_sign_in.dart
          flutter build ipa --release --export-method app-store \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="${GOOGLE_SERVER_CLIENT_ID:-}" \
            --dart-define=GOOGLE_IOS_CLIENT_ID="${GOOGLE_IOS_CLIENT_ID:-}" \
            --dart-define=ONESIGNAL_APP_ID="$ONESIGNAL_APP_ID"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
