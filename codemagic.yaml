workflows:
  android-release:
    name: Android Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      groups:
        - rider_signing
      vars:
        GOOGLE_SERVER_CLIENT_ID: "878060644963-ujmbu0ka7g3rh07muknotij2lbsaq4oh.apps.googleusercontent.com"
        GOOGLE_IOS_CLIENT_ID: "878060644963-pfh25sa295qbh5fqqbhecegnpnclsc95.apps.googleusercontent.com"
        PACKAGE_NAME: "com.naijago.gorider"
        API_BASE_URL: "https://naijago-backend.onrender.com"
        ONESIGNAL_APP_ID: "d53ab8f7-7a3b-40e4-b3a3-025fa64004d1"
    cache:
      cache_paths:
        - ~/.pub-cache
        - ~/.gradle/caches
        - ~/.gradle/wrapper
    scripts:
      - name: Validate rider configuration and prepare version metadata
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          : "${API_BASE_URL:?Set the rider backend URL}"
          : "${ONESIGNAL_APP_ID:?Set the public rider OneSignal app ID}"
          : "${GOOGLE_SERVER_CLIENT_ID:?Set the public Google server client ID}"
          : "${GOOGLE_IOS_CLIENT_ID:?Set the public Google iOS client ID}"
          APP_VERSION="$(awk '$1 == "version:" {print $2; exit}' pubspec.yaml)"
          test -n "$APP_VERSION"
          printf 'APP_VERSION=%s\n' "$APP_VERSION" >> "$CM_ENV"
      - name: Set up local.properties
        script: |
          set -euo pipefail
          printf 'flutter.sdk=%s\n' "${FLUTTER_ROOT:-$HOME/programs/flutter}" > "$CM_BUILD_DIR/android/local.properties"
      - name: Install dependencies
        script: |
          set -euo pipefail
          flutter pub get
      - name: Validate public Google sign-in configuration
        script: |
          set -euo pipefail
          dart run tool/configure_google_sign_in.dart
      - name: Analyze
        script: |
          set -euo pipefail
          flutter analyze
      - name: Run tests
        script: |
          set -euo pipefail
          flutter test --no-pub
      - name: Configure Android signing
        script: |
          set -euo pipefail
          if [ -z "${CM_KEYSTORE:-}" ] || [ -z "${CM_KEYSTORE_PASSWORD:-}" ] || [ -z "${CM_KEY_ALIAS:-}" ] || [ -z "${CM_KEY_PASSWORD:-}" ]; then
            echo "Missing Android signing variables. Set CM_KEYSTORE, CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS, and CM_KEY_PASSWORD in Codemagic."
            exit 1
          fi

          echo "$CM_KEYSTORE" | base64 --decode > "$CM_BUILD_DIR/android/app/upload-keystore.jks"
          {
            printf "%s\n" "storePassword=$CM_KEYSTORE_PASSWORD"
            printf "%s\n" "keyPassword=$CM_KEY_PASSWORD"
            printf "%s\n" "keyAlias=$CM_KEY_ALIAS"
            printf "%s\n" "storeFile=upload-keystore.jks"
          } > "$CM_BUILD_DIR/android/key.properties"
      - name: Build Android artifacts
        script: |
          set -euo pipefail
          flutter build apk --release --no-pub \
            --dart-define=APP_VERSION="$APP_VERSION" \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="${GOOGLE_SERVER_CLIENT_ID:-}" \
            --dart-define=GOOGLE_IOS_CLIENT_ID="${GOOGLE_IOS_CLIENT_ID:-}" \
            --dart-define=ONESIGNAL_APP_ID="$ONESIGNAL_APP_ID"
          flutter build appbundle --release --no-pub \
            --dart-define=APP_VERSION="$APP_VERSION" \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="${GOOGLE_SERVER_CLIENT_ID:-}" \
            --dart-define=GOOGLE_IOS_CLIENT_ID="${GOOGLE_IOS_CLIENT_ID:-}" \
            --dart-define=ONESIGNAL_APP_ID="$ONESIGNAL_APP_ID"
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/bundle/release/*.aab

  ios-release:
    name: iOS App Store Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        GOOGLE_SERVER_CLIENT_ID: "878060644963-ujmbu0ka7g3rh07muknotij2lbsaq4oh.apps.googleusercontent.com"
        GOOGLE_IOS_CLIENT_ID: "878060644963-pfh25sa295qbh5fqqbhecegnpnclsc95.apps.googleusercontent.com"
        API_BASE_URL: "https://naijago-backend.onrender.com"
        ONESIGNAL_APP_ID: "d53ab8f7-7a3b-40e4-b3a3-025fa64004d1"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.naijago.gorider
    integrations:
      app_store_connect: naijago_mainapp_key
    cache:
      cache_paths:
        - ~/.pub-cache
        - ~/Library/Caches/CocoaPods
    scripts:
      - name: Validate rider configuration and prepare version metadata
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          : "${API_BASE_URL:?Set the rider backend URL}"
          : "${ONESIGNAL_APP_ID:?Set the public rider OneSignal app ID}"
          : "${GOOGLE_SERVER_CLIENT_ID:?Set the public Google server client ID}"
          : "${GOOGLE_IOS_CLIENT_ID:?Set the public Google iOS client ID}"
          APP_VERSION="$(awk '$1 == "version:" {print $2; exit}' pubspec.yaml)"
          test -n "$APP_VERSION"
          printf 'APP_VERSION=%s\n' "$APP_VERSION" >> "$CM_ENV"
      - name: Install dependencies
        script: |
          set -euo pipefail
          flutter pub get
      - name: Prepare Google iOS callback configuration
        script: |
          set -euo pipefail
          dart run tool/configure_google_sign_in.dart
      - name: Install pods
        script: |
          set -euo pipefail
          cd ios
          pod install
      - name: Configure App Store signing
        script: |
          set -euo pipefail
          xcode-project use-profiles
      - name: Analyze
        script: |
          set -euo pipefail
          flutter analyze
      - name: Run tests
        script: |
          set -euo pipefail
          flutter test --no-pub
      - name: Build signed IPA
        script: |
          set -euo pipefail
          flutter build ipa --release --no-pub --export-method app-store \
            --dart-define=APP_VERSION="$APP_VERSION" \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="${GOOGLE_SERVER_CLIENT_ID:-}" \
            --dart-define=GOOGLE_IOS_CLIENT_ID="${GOOGLE_IOS_CLIENT_ID:-}" \
            --dart-define=ONESIGNAL_APP_ID="$ONESIGNAL_APP_ID"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
